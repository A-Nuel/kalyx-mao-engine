[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autonomous_org"
version = "0.1.0"
description = "Minimum Autonomous Organisation (MAO) Infrastructure"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2,<3",
    "rich>=13,<15",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "cryptography>=43,<47",
    # Phase 12 blockchain settlement boundary (imported by src/settlement/blockchain/*)
    "eth-account>=0.13,<0.14",
    "web3>=7,<8",
    # Phase 14B.1 — deterministic buyAndActivate argument encoding
    "eth-abi>=5,<6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-asyncio>=0.23,<1",
    "psycopg[binary,pool]>=3.1,<4",
]
postgres = [
    "psycopg[binary,pool]>=3.1,<4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
markers = [
    "postgres: tests that require a live PostgreSQL instance (KALYX_DATABASE_URL)",
]
