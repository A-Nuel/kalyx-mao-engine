name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    env:
      # Deterministic test-only secret; production secrets must never be hard-coded here.
      KALYX_RECEIPT_SECRET_KEY: ci-only-kalyx-receipt-secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kalyx
          POSTGRES_PASSWORD: kalyx
          POSTGRES_DB: kalyx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kalyx -d kalyx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q src tests

      - name: Build production container
        if: matrix.python-version == '3.12'
        run: docker build --tag kalyx-ci .

      - name: Run SQLite test suite
        run: python -m pytest -q -m "not postgres"

      - name: Run PostgreSQL integration suite
        env:
          KALYX_DATABASE_URL: postgresql://kalyx:kalyx@localhost:5432/kalyx
        run: python -m pytest -q -m postgres
