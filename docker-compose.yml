services:
  kalyx-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalyx-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      KALYX_ENV: ${KALYX_ENV:-production}
      KALYX_DATABASE_URL: ${KALYX_DATABASE_URL:?KALYX_DATABASE_URL is required}
      KALYX_POLICY_SECRET: ${KALYX_POLICY_SECRET:?KALYX_POLICY_SECRET is required}
      KALYX_OPERATOR_KEY: ${KALYX_OPERATOR_KEY:?KALYX_OPERATOR_KEY is required}
      KALYX_RECEIPT_SECRET_KEY: ${KALYX_RECEIPT_SECRET_KEY:?KALYX_RECEIPT_SECRET_KEY is required}
      KALYX_IDENTITY_AUTH: ${KALYX_IDENTITY_AUTH:-production}
      KALYX_REQUIRE_OPERATOR_AUTH: ${KALYX_REQUIRE_OPERATOR_AUTH:-true}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  kalyx-demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalyx-demo
    env_file:
      - .env
    environment:
      KALYX_ENV: demo
      KALYX_DB: /app/data/kalyx.db
      KALYX_IDENTITY_AUTH: demo
    volumes:
      - kalyx-demo-data:/app/data
    command: ["python", "scripts/run_phase17_demo.py"]
    profiles: ["demo"]

  kalyx-test:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kalyx-test
    env_file:
      - .env
    environment:
      KALYX_ENV: demo
      KALYX_DB: /app/data/kalyx-test.db
      KALYX_IDENTITY_AUTH: demo
    volumes:
      - kalyx-test-data:/app/data
    command: ["python", "-m", "pytest", "tests/", "-v"]
    profiles: ["test"]

volumes:
  kalyx-demo-data:
  kalyx-test-data:
